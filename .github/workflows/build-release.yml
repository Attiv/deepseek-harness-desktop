name: Build & Release

on:
  # 手动触发:在 Actions 页面点 "Run workflow"
  workflow_dispatch:
  # 打 tag 触发:git tag v1.0.0 && git push --tags
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # macOS Intel
            args: "--target x86_64-apple-darwin"
          - platform: "macos-latest" # macOS Apple Silicon
            args: "--target aarch64-apple-darwin"
          - platform: "ubuntu-22.04" # Linux (可选)
            args: ""
          - platform: "windows-latest" # Windows
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS 需要额外 target 才能交叉编译两种架构
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DeepSeek Harness Desktop ${{ github.ref_name }}"
          releaseBody: |
            ## DeepSeek Harness Desktop

            自动构建的桌面应用,支持 Windows / macOS / Linux。

            ### 安装
            - **Windows**: 下载 `*-setup.exe`(NSIS 安装程序)或 `*.msi`
            - **macOS**: 下载 `.dmg`(Intel 用 x86_64,Apple Silicon 用 aarch64)
            - **Linux**: 下载 `.AppImage` 或 `.deb`

            ### 说明
            - 后端走 `npx @deepseek-ai/dsh web`,官方更新自动跟随
            - 需要 Node.js 环境
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
