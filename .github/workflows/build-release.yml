name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Job 1: 创建 Release(只跑一次)
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release-url: ${{ steps.create.outputs.url }}
    steps:
      - name: Create Release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "DeepSeek Harness Desktop ${{ github.ref_name }}"
          body: |
            ## DeepSeek Harness Desktop

            自动构建的桌面应用,支持 Windows / macOS / Linux。

            ### 安装
            - **Windows**: 下载 `*-setup.exe`(NSIS 安装程序)或 `*.msi`
            - **macOS**: 下载 `.dmg`(Intel 用 x64,Apple Silicon 用 aarch64)
            - **Linux**: 下载 `.AppImage` 或 `.deb`

            ### 说明
            - 默认使用 npm `latest` 稳定频道,避免预览版与 profile 插件不兼容；可通过 `app-dsh-channel` 显式选择 `next` 或 `newest`
            - 后端优先走 `pnpm dlx @deepseek-ai/dsh@<频道> web --no-open`,没装 pnpm 时自动回退 `npx -y`
            - 菜单「配置 → 一键更新全部插件」会更新 web profile 的全部插件,完成后重启 DSH 生效
            - 需要 **Node.js ≥ 22.19**(新版 dsh 依赖);pnpm 可选
          draft: false
          prerelease: false

  # Job 2: 并行构建各平台,上传产物到 Release
  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        shell: bash
        run: |
          # 从 tag 提取版本号(如 v1.3.7 → 1.3.7),写入 tauri.conf.json 和 package.json
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          echo "Version: $VERSION"
          sed -i.bak "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          sed -i.bak "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" package.json
          sed -i.bak "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          cat src-tauri/tauri.conf.json | grep version

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 22.23 LTS:新版 dsh(rc.8+)的 pi-ai 要求 node >= 22.19,构建环境与运行时对齐
          node-version: 22
          cache: "pnpm"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies (pnpm, fallback npm)
        shell: bash
        run: |
          if command -v pnpm >/dev/null 2>&1; then
            echo "Using pnpm: $(pnpm --version)"
            pnpm install --frozen-lockfile
          else
            echo "pnpm not found, falling back to npm"
            npm install
          fi

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          # 不设 releaseName/releaseBody/releaseDraft,避免重复创建
          # tauri-action 会找到上面 softprops 已创建的 Release 并上传产物
          args: ${{ matrix.args }}
