<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>DeepSeek Harness</title>
  <style>
    html,body{margin:0;height:100%;background:#0d1117;color:#c9d1d9;
      font-family:"Segoe UI",system-ui,sans-serif;display:flex;
      align-items:center;justify-content:center;flex-direction:column;gap:18px}
    .spinner{width:42px;height:42px;border:4px solid #21262d;border-top-color:#58a6ff;
      border-radius:50%;animation:spin .9s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .t{font-size:15px;opacity:.85}
    .s{font-size:12px;opacity:.5;font-family:Consolas,monospace}
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div class="t">正在启动 DeepSeek Harness…</div>
  <div class="s">npx @deepseek-ai/dsh web</div>
</body>
</html>
